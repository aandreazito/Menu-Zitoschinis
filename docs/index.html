<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column. A month-coloured band like the paper planner, a day strip,
   then one card per day with colazione / pranzo / cena rows. Bottom tab bar. */
:root {
  --paper: #f7f8f6;
  --card: #ffffff;
  --ink: #1d2422;
  --muted: #66716d;
  --line: #e2e6e3;
  --soft: #eef1ef;
  --az: #2f5fa8;
  --az-soft: #e3ebf7;
  --at: #c2456a;
  --at-soft: #f8e4ea;
  --out: #8a6d2f;
  --out-soft: #f4ecda;
  --month: #3f6680;
  --month-ink: #ffffff;
  --focus: #2f5fa8;
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121615; --card: #1b201f; --ink: #e8ecea; --muted: #9aa5a1; --line: #2c3331; --soft: #242a29;
  --az: #8fb2ec; --az-soft: #1f2c40; --at: #f08fac; --at-soft: #3a2029; --out: #d9bb78; --out-soft: #332b1a;
  --focus: #8fb2ec; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #121615; --card: #1b201f; --ink: #e8ecea; --muted: #9aa5a1; --line: #2c3331; --soft: #242a29;
  --az: #8fb2ec; --az-soft: #1f2c40; --at: #f08fac; --at-soft: #3a2029; --out: #d9bb78; --out-soft: #332b1a;
  --focus: #8fb2ec; color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--body); font-size: 16px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--month); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- month band ---------- */
.band { background: var(--month); color: var(--month-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.band .wrap { padding-block: 10px 12px; display: grid; gap: 10px; }
.band-top { display: flex; align-items: center; gap: 8px; }
.brand { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .85; font-weight: 600; flex: 1; }
.iconbtn { border: 0; background: color-mix(in srgb, var(--month-ink) 16%, transparent); color: var(--month-ink); border-radius: 999px; min-width: 36px; height: 36px; padding: 0 12px; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.iconbtn svg { width: 18px; height: 18px; }
.month-row { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
.month { font-family: var(--display); font-weight: 700; font-size: clamp(28px, 8vw, 36px); letter-spacing: .04em; line-height: 1; text-transform: uppercase; text-wrap: balance; }
.weekno { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .85; font-variant-numeric: tabular-nums; min-width: 0; }
.strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.strip button { border: 0; background: transparent; color: var(--month-ink); border-radius: 10px; padding: 4px 0 6px; display: grid; gap: 0; justify-items: center; }
.strip .dn { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.strip .dd { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.strip button.today { background: var(--month-ink); color: var(--month); }
.strip button.today .dn { opacity: 1; }
.strip .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: 0; margin-top: 2px; }
.strip .has .dot { opacity: .55; }

/* ---------- views ---------- */
main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 12px; padding-block: 14px 8px; }
.seg { display: flex; background: var(--soft); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 7px 8px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

.day { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; scroll-margin-top: 190px; }
.day.is-today { border-color: var(--month); box-shadow: 0 0 0 1px var(--month); }
.day.is-past { opacity: .72; }
.dayhead { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; flex-wrap: wrap; border: 0; background: none; width: 100%; text-align: left; }
.dayname { font-weight: 700; font-size: 15px; text-transform: capitalize; }
.daydate { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.todaytag { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--month-ink); background: var(--month); border-radius: 999px; padding: 2px 8px; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
.tag { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 8px; }
.tag.az { background: var(--az-soft); color: var(--az); }
.tag.at { background: var(--at-soft); color: var(--at); }
.daynote { padding: 0 12px 6px; color: var(--muted); font-size: 14px; }

.meal { display: grid; grid-template-columns: 74px 1fr; gap: 10px; align-items: start; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 12px; min-height: 46px; }
.meal:active { background: var(--soft); }
.mlabel { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-top: 3px; }
.mbody { min-width: 0; display: grid; gap: 4px; }
.dish { font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.dish.empty { color: var(--muted); font-weight: 400; font-style: italic; font-size: 15px; }
.dish.out { color: var(--out); font-style: italic; }
.dish .outmark { font-style: normal; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--out-soft); color: var(--out); border-radius: 6px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
.who { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: baseline; }
.who b { font-size: 11px; font-weight: 700; border-radius: 6px; text-align: center; padding: 2px 0; letter-spacing: .04em; }
.who b.az { background: var(--az-soft); color: var(--az); }
.who b.at { background: var(--at-soft); color: var(--at); }

.empty-week { background: var(--card); border: 1px dashed var(--line); border-radius: var(--r); padding: 18px 16px; display: grid; gap: 12px; }
.empty-week h2 { margin: 0; font-family: var(--display); font-size: 24px; font-weight: 500; }
.empty-week p { margin: 0; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 14px; font-weight: 600; font-size: 15px; text-align: left; display: flex; align-items: center; gap: 10px; }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); justify-content: center; }
.btn small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
.btn.primary small { color: inherit; opacity: .75; }
.btns { display: grid; gap: 8px; }
.notice { background: var(--out-soft); color: var(--ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; }

/* ---------- recipes ---------- */
.search { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 11px 12px; font-size: 16px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.rlist { display: grid; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ritem { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 11px 12px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.ritem:first-child { border-top: 0; }
.rname { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.rmeta { grid-column: 1 / -1; color: var(--muted); font-size: 13px; display: flex; gap: 8px; flex-wrap: wrap; }
.rcount { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; align-self: center; }
.fav { color: var(--at); }
.months { display: inline-flex; gap: 2px; align-items: center; }
.months i { width: 6px; height: 6px; border-radius: 2px; background: var(--line); display: inline-block; }
.months i.on { background: var(--muted); }

.hitem { display: grid; grid-template-columns: 10px 1fr auto; gap: 12px; align-items: center; padding: 12px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .38); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--card); border-radius: 18px 18px 0 0; max-height: 88%; overflow-y: auto; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 30px rgb(0 0 0 / .18); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6 } to { transform: none; opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
.sheet .wrap { display: grid; gap: 14px; padding-block: 8px 0; }
.grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 4px auto 0; }
.sheet h3 { margin: 0; font-size: 19px; font-weight: 700; }
.sheet .sub { color: var(--muted); font-size: 14px; margin-top: -10px; }
.field { display: grid; gap: 6px; }
.field label, .flabel { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.field input[type=text], .field textarea, .field select { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 11px 12px; font-size: 16px; }
.field textarea { min-height: 70px; resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.switch { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; }

.actions .btn { justify-content: center; }

.occ { display: grid; gap: 4px; font-size: 14px; }
.occ div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding: 6px 0; }
.occ span:last-child { color: var(--muted); text-align: right; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 10px; font-size: 14px; }
.pill[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 60; }
.status { color: var(--muted); font-size: 13px; text-align: center; padding: 4px 0 0; }

<div id="sheetRoot"></div>

<script>
(() => {
"use strict";

/* ================= costanti ================= */
const MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const GIORNI = ["lunedì","martedì","mercoledì","giovedì","venerdì","sabato","domenica"];
const GIORNI_BREVI = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
const PASTI = [["c","Colazione"],["p","Pranzo"],["d","Cena"]];
const PASTO_NOME = { c: "Colazione", p: "Pranzo", d: "Cena" };
const PERSONE = { az: "Andrea", at: "Alice" };
/* Colori delle copertine del planner cartaceo, mese per mese */
const MONTH_COLORS = [
  ["#2e6a6e","#ffffff"], ["#6f3f86","#ffffff"], ["#4a69ad","#ffffff"], ["#e7a3bf","#4a1d33"],
  ["#a07c35","#ffffff"], ["#86b9bd","#183c40"], ["#6b8c2c","#ffffff"], ["#c06a34","#ffffff"],
  ["#3a2f78","#ffffff"], ["#9cb6d6","#1f3653"], ["#3f6680","#ffffff"], ["#8c2f3a","#ffffff"]
];
const STAGIONI = [
  { id: "inverno", nome: "Inverno", mesi: [11,0,1] },
  { id: "primavera", nome: "Primavera", mesi: [2,3,4] },
  { id: "estate", nome: "Estate", mesi: [5,6,7] },
  { id: "autunno", nome: "Autunno", mesi: [8,9,10] }
];
const STATI_GIORNO = ["", "ufficio", "fuori", "palestra", "viaggio"];

/* ================= date ================= */
const pad = n => String(n).padStart(2, "0");
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay() + 6) % 7; return addDays(x, -wd); };
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
const seasonOfMonth = m => STAGIONI.find(s => s.mesi.includes(m));
const shortDate = d => `${d.getDate()} ${MESI[d.getMonth()].slice(0,3).toLowerCase()}`;
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };

/* ================= utility ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ls = {
  get(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const clone = o => JSON.parse(JSON.stringify(o));
const emptyDays = () => Array.from({ length: 7 }, () => ({ c: null, p: null, d: null }));
let toastTimer;
function toast(msg) {
  let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200);
}

/* ================= archivio dati =================
   Nell'artifact: database condiviso (collezioni "weeks" e "recipes").
   Fuori dall'artifact (GitHub Pages / file locale): localStorage, con lo storico iniziale incorporato. */
const Store = {
  mode: "loading", db: null, canWrite: true, weeks: new Map(), recipes: new Map(), ready: false, stale: false,
  chains: new Map(),
  async init(onChange) {
    this.onChange = onChange;
    let db = null;
    if (window.claude && typeof window.claude.use === "function") {
      try { db = await window.claude.use("db"); } catch { db = null; }
    }
    if (db) {
      this.mode = "db"; this.db = db;
      try {
        const user = await window.claude.use("user");
        if (user && typeof user.can === "function") { const c = await user.can("data.write"); if (c === false) this.canWrite = false; }
      } catch {}
      const timer = setTimeout(() => { if (!this.ready) { this.stale = true; this.onChange(); } }, 10000);
      const sub = (name, map) => db.collection(name).onSnapshot(snap => {
        map.clear(); snap.docs.forEach(d => map.set(d.id, d.data()));
        if (!snap.metadata.fromCache) { clearTimeout(timer); this.ready = true; this.stale = false; }
        this.onChange();
      }, () => { clearTimeout(timer); this.ready = true; this.stale = true; this.onChange(); });
      sub("weeks", this.weeks); sub("recipes", this.recipes);
    } else {
      this.mode = "local";
      let weeks = ls.get("mz.weeks", null);
      if (!weeks && window.MENU_SEED) { weeks = {}; window.MENU_SEED.weeks.forEach(w => weeks[w.id] = w); ls.set("mz.weeks", weeks); }
      Object.entries(weeks || {}).forEach(([k, v]) => this.weeks.set(k, v));
      Object.entries(ls.get("mz.recipes", {})).forEach(([k, v]) => this.recipes.set(k, v));
      this.ready = true; this.onChange();
    }
  },
  /* una scrittura alla volta per documento */
  _write(path, fn) {
    const prev = this.chains.get(path) || Promise.resolve();
    const next = prev.catch(() => {}).then(fn);
    this.chains.set(path, next);
    return next;
  },
  async saveWeek(w) {
    const doc = clone(w); doc.updatedAt = new Date().toISOString();
    this.weeks.set(w.id, doc);
    if (this.mode === "db") {
      try { await this._write("weeks/" + w.id, () => this.db.doc("weeks/" + w.id).set(doc)); }
      catch (e) { if (e && e.code === "invalid_argument") this.canWrite = false; toast("Non salvato: " + (e && e.code === "quota_exceeded" ? "archivio pieno" : "riprova tra poco")); throw e; }
    } else { ls.set("mz.weeks", Object.fromEntries(this.weeks)); }
    this.onChange();
  },
  async deleteWeek(id) {
    this.weeks.delete(id);
    if (this.mode === "db") await this._write("weeks/" + id, () => this.db.doc("weeks/" + id).delete());
    else ls.set("mz.weeks", Object.fromEntries(this.weeks));
    this.onChange();
  },
  async saveRecipe(key, data) {
    const doc = clone(data);
    this.recipes.set(key, doc);
    if (this.mode === "db") {
      try { await this._write("recipes/" + key, () => this.db.doc("recipes/" + key).set(doc)); }
      catch (e) { toast("Non salvato, riprova"); throw e; }
    } else ls.set("mz.recipes", Object.fromEntries(this.recipes));
    this.onChange();
  }
};

/* ================= ricette dallo storico ================= */
const NON_RICETTA = /^(avanz|zuppa pronta|deli\b|delicatessen|ufficio|fuori|toast$|brunch$|light breakfast)/i;
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();
const keyOf = s => norm(s).replace(/ /g, "-").slice(0, 120) || "x";
const mainOf = t => t.split(/\s\+\s/)[0].trim();
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

function itemsOf(meal) {
  if (!meal) return [];
  if (meal.split) return [["az", meal.az], ["at", meal.at]].filter(([, v]) => v);
  return [[null, meal]];
}

let recipeIndex = null;
function buildIndex() {
  const map = new Map();
  const touch = (name, extra) => {
    const k = keyOf(name);
    if (!map.has(k)) map.set(k, { key: k, name: cap(name), uses: [], months: new Set(), meals: new Set(), sides: new Map(), manual: false });
    return map.get(k);
  };
  for (const w of Store.weeks.values()) {
    const mon = parseISO(w.id);
    (w.days || []).forEach((day, i) => {
      const date = addDays(mon, i);
      PASTI.forEach(([m]) => itemsOf(day[m]).forEach(([who, it]) => {
        if (!it || !it.t || it.x) return;
        const main = mainOf(it.t);
        if (!main || NON_RICETTA.test(main) || /avanzat/i.test(main)) return;
        const r = touch(main);
        r.uses.push({ date: isoDate(date), meal: m, who, full: it.t });
        r.months.add(date.getMonth()); r.meals.add(m);
        it.t.split(/\s\+\s/).slice(1).forEach(s => { const sk = cap(s.trim()); if (sk) r.sides.set(sk, (r.sides.get(sk) || 0) + 1); });
      }));
    });
  }
  for (const [k, extra] of Store.recipes) {
    const r = map.get(k) || (extra.name ? touch(extra.name) : null);
    if (!r) continue;
    r.extra = extra; r.manual = !!extra.manual && r.uses.length === 0;
    (extra.seasons || []).forEach(sid => (STAGIONI.find(s => s.id === sid)?.mesi || []).forEach(m => r.months.add(m)));
    (extra.meals || []).forEach(m => r.meals.add(m));
  }
  for (const r of map.values()) {
    r.uses.sort((a, b) => a.date < b.date ? 1 : -1);
    r.last = r.uses[0]?.date || null;
    r.fav = !!r.extra?.fav;
    r.seasons = new Set([...r.months].map(m => seasonOfMonth(m).id));
  }
  recipeIndex = map;
  return map;
}

/* proposte per un pasto in una data: di stagione, preferite in alto, non ripetute di recente */
function suggest(meal, date, query = "", limit = 10, exclude = new Set()) {
  const idx = recipeIndex || buildIndex();
  const season = seasonOfMonth(date.getMonth()).id;
  const q = norm(query);
  const dISO = isoDate(date);
  const recent = isoDate(addDays(date, -12));
  const list = [];
  for (const r of idx.values()) {
    if (exclude.has(r.key)) continue;
    if (q) { if (!norm(r.name).includes(q)) continue; }
    else if (!r.meals.has(meal)) continue;
    const inSeason = r.seasons.has(season);
    if (!q && !inSeason) continue;
    const usedRecently = r.uses.some(u => u.date >= recent && u.date <= dISO && u.date !== dISO);
    const seasonUses = r.uses.filter(u => seasonOfMonth(parseISO(u.date).getMonth()).id === season).length;
    let score = seasonUses * 2 + r.uses.length + (r.fav ? 8 : 0) + (inSeason ? 4 : 0) - (usedRecently ? 30 : 0);
    if (q && norm(r.name).startsWith(q)) score += 20;
    list.push({ r, score, usedRecently });
  }
  list.sort((a, b) => b.score - a.score || a.r.name.localeCompare(b.r.name));
  return list.slice(0, limit);
}

/* ================= stato UI ================= */
const ui = {
  weekStart: mondayOf(today()),
  who: ls.get("mz.who", "tutti"),
  tab: "settimana",
  season: seasonOfMonth(today().getMonth()).id,
  rmeal: ls.get("mz.rmeal", "d"),
  rquery: "",
  scrolledFor: null
};

function weekDoc(id) { return Store.weeks.get(id) || null; }

/* ================= band ================= */
function renderBand() {
  const ws = ui.weekStart, we = addDays(ws, 6);
  const tISO = isoDate(today());
  const month = ws.getMonth() === we.getMonth() ? MESI[ws.getMonth()] : `${MESI[ws.getMonth()]} / ${MESI[we.getMonth()]}`;
  const mid = addDays(ws, 3).getMonth();
  const [bg, fg] = MONTH_COLORS[mid];
  document.documentElement.style.setProperty("--month", bg);
  document.documentElement.style.setProperty("--month-ink", fg);
  $("#monthName").textContent = month;
  $("#weekNo").textContent = `Settimana ${isoWeek(ws)} · ${ws.getDate()}–${we.getDate()} ${MESI[we.getMonth()].slice(0,3).toLowerCase()}`;
  const w = weekDoc(isoDate(ws));
  $("#strip").innerHTML = GIORNI_BREVI.map((g, i) => {
    const d = addDays(ws, i), day = w?.days?.[i];
    const has = day && (day.c || day.p || day.d);
    return `<button data-jump="${i}" class="${isoDate(d) === tISO ? "today" : ""} ${has ? "has" : ""}" aria-label="${GIORNI[i]} ${d.getDate()}"><span class="dn">${g}</span><span class="dd">${d.getDate()}</span><span class="dot"></span></button>`;
  }).join("");
  $("#band").hidden = ui.tab !== "settimana";
}

/* ================= vista settimana ================= */
function renderItem(it, who) {
  if (!it || !it.t) return `<span class="dish empty">${who ? "—" : "Da decidere"}</span>`;
  return it.x ? `<span class="dish out"><span class="outmark">fuori</span>${esc(it.t)}</span>` : `<span class="dish">${esc(it.t)}</span>`;
}
function renderMeal(meal) {
  if (!meal) return renderItem(null);
  if (!meal.split) return renderItem(meal);
  const rows = [["az", meal.az], ["at", meal.at]].filter(([p]) => ui.who === "tutti" || ui.who === p);
  if (ui.who !== "tutti") return renderItem(rows[0][1]);
  return rows.map(([p, it]) => `<div class="who"><b class="${p}">${p.toUpperCase()}</b>${renderItem(it, p)}</div>`).join("");
}

function renderWeek() {
  const el = $("#v-settimana");
  const id = isoDate(ui.weekStart);
  const w = weekDoc(id);
  const tISO = isoDate(today());
  let html = `<div class="seg" role="group" aria-label="Mostra pasti di">
    ${[["tutti","Tutti e due"],["az","Andrea"],["at","Alice"]].map(([k,l]) => `<button data-who="${k}" aria-pressed="${ui.who === k}">${l}</button>`).join("")}
  </div>`;
  if (Store.mode === "loading" || (!Store.ready && !Store.weeks.size)) {
    html += `<div class="status">Carico il menu…</div>`;
  }
  if (Store.stale) html += `<div class="notice">Il menu condiviso non risponde: quello che vedi potrebbe non essere aggiornato.</div>`;
  if (!Store.canWrite) html += `<div class="notice">Puoi vedere il menu ma non modificarlo. Chiedi ad Andrea di darti l'accesso come editor.</div>`;

  if (!w && Store.ready) {
    const prev = weekDoc(isoDate(addDays(ui.weekStart, -7)));
    const season = seasonOfMonth(addDays(ui.weekStart, 3).getMonth()).nome.toLowerCase();
    html += `<div class="empty-week">
      <h2>Settimana da compilare</h2>
      <p>Parti da zero oppure fatti aiutare dall'archivio: proposte di ${season} prese dalle settimane passate, senza ripetere quello che avete mangiato di recente.</p>
      <div class="btns">
        <button class="btn primary" data-act="propose">Proponi pranzi e cene<small>Puoi cambiare tutto dopo</small></button>
        ${prev ? `<button class="btn" data-act="copyBreakfast">Copia le colazioni della settimana scorsa</button>` : ""}
        <button class="btn" data-act="blank">Inizia vuota</button>
      </div>
    </div>`;
  }
  if (w) {
    html += (w.days || emptyDays()).map((day, i) => {
      const d = addDays(ui.weekStart, i), dISO = isoDate(d);
      const tags = Object.entries(day.tags || {}).filter(([, v]) => v).map(([p, v]) => `<span class="tag ${p}">${p.toUpperCase()} ${esc(v)}</span>`).join("");
      return `<article class="day ${dISO === tISO ? "is-today" : ""} ${dISO < tISO ? "is-past" : ""}" id="day-${i}">
        <button class="dayhead" data-dayedit="${i}" aria-label="Impegni di ${GIORNI[i]}">
          <span class="dayname">${GIORNI[i]}</span><span class="daydate">${d.getDate()} ${MESI[d.getMonth()].toLowerCase()}</span>
          ${dISO === tISO ? `<span class="todaytag">Oggi</span>` : ""}
          <span class="tags">${tags}</span>
        </button>
        ${day.note ? `<div class="daynote">${esc(day.note)}</div>` : ""}
        ${PASTI.map(([m, label]) => `<button class="meal" data-edit="${i}:${m}"><span class="mlabel">${label}</span><span class="mbody">${renderMeal(day[m])}</span></button>`).join("")}
      </article>`;
    }).join("");
    if (w.note) html += `<div class="notice">${esc(w.note)}</div>`;
    html += `<button class="ghost" data-act="weeknote">${w.note ? "Modifica nota della settimana" : "+ Nota della settimana (spesa, da cucinare…)"}</button>`;
  }
  el.innerHTML = html;
  if (w && ui.scrolledFor !== id) {
    ui.scrolledFor = id;
    const ti = Math.round((today() - ui.weekStart) / 864e5);
    if (ti > 0 && ti < 7) requestAnimationFrame(() => document.getElementById("day-" + ti)?.scrollIntoView({ block: "start" }));
    else window.scrollTo(0, 0);
  }
}

/* ================= vista ricette ================= */
function renderRecipes() {
  const el = $("#v-ricette");
  const idx = buildIndex();
  const season = STAGIONI.find(s => s.id === ui.season);
  const q = norm(ui.rquery);
  let list = [...idx.values()].filter(r => r.seasons.has(ui.season) || (q && norm(r.name).includes(q)));
  if (q) list = list.filter(r => norm(r.name).includes(q) || [...r.sides.keys()].some(s => norm(s).includes(q)));
  if (ui.rmeal !== "tutti") list = list.filter(r => r.meals.has(ui.rmeal));
  const sScore = r => r.uses.filter(u => season.mesi.includes(parseISO(u.date).getMonth())).length;
  list.sort((a, b) => (b.fav - a.fav) || (sScore(b) - sScore(a)) || a.name.localeCompare(b.name));
  const favs = list.filter(r => r.fav), rest = list.filter(r => !r.fav);
  const item = r => {
    const months = Array.from({ length: 12 }, (_, m) => `<i class="${r.months.has(m) ? "on" : ""}"></i>`).join("");

    <input class="search" id="rsearch" type="search" placeholder="Cerca: ceci, zucca, tofu…" value="${esc(ui.rquery)}" aria-label="Cerca ricette">
    <div class="seg" role="group" aria-label="Stagione">${STAGIONI.map(s => `<button data-season="${s.id}" aria-pressed="${s.id === ui.season}">${s.nome}</button>`).join("")}</div>

      <button class="chip" data-act="newrecipe">+ Nuova ricetta</button></div>
    <p class="count-note">${list.length} ricette ${q ? "trovate" : "di " + season.nome.toLowerCase()} · ordinate per quante volte le avete fatte in questa stagione</p>
    ${favs.length ? `<div class="sectiontitle">Preferite</div><div class="rlist">${favs.map(item).join("")}</div>` : ""}
    ${rest.length ? `${favs.length ? `<div class="sectiontitle">Tutte</div>` : ""}<div class="rlist">${rest.map(item).join("")}</div>` : (favs.length ? "" : `<div class="empty-week"><p>Nessuna ricetta qui. Le ricette si aggiungono da sole quando compilate le settimane, oppure con “Nuova ricetta”.</p></div>`)}

/* --- modifica di un pasto --- */
function editMeal(i, m) {
  const id = isoDate(ui.weekStart);
  const w = clone(weekDoc(id) || { id, days: emptyDays() });
  const day = w.days[i]; const meal = day[m];
  const date = addDays(ui.weekStart, i);
  const split = !!(meal && meal.split);
  const v = { all: meal && !meal.split ? meal : null, az: meal?.split ? meal.az : null, at: meal?.split ? meal.at : null };
  const input = (key, label, it) => `<div class="field" data-field="${key}">
      <label for="in-${key}">${label}</label>
      <input type="text" id="in-${key}" autocomplete="off" value="${esc(it?.t || "")}" placeholder="Es. ${m === "c" ? "Porridge" : m === "p" ? "Pasta ceci e rosmarino" : "Sticky tofu + pak choi"}">
      <span class="small-switch"><input type="checkbox" id="x-${key}" ${it?.x ? "checked" : ""}><label for="x-${key}">Fuori casa / evento (non entra nelle ricette)</label></span>
    </div>`;
  openSheet(`
    <h3>${PASTO_NOME[m]} di ${GIORNI[i]}</h3><div class="sub">${date.getDate()} ${MESI[date.getMonth()].toLowerCase()}</div>
    <label class="switch"><input type="checkbox" id="splitT" ${split ? "checked" : ""}> Diverso per Andrea e Alice</label>
    <div id="fieldsAll" ${split ? "hidden" : ""}>${input("all", PASTO_NOME[m], v.all)}</div>
    <div id="fieldsSplit" ${split ? "" : "hidden"} style="display:grid;gap:12px">${input("az", "Andrea (AZ)", v.az)}${input("at", "Alice (AT)", v.at)}</div>
    <div class="sugg"><div class="flabel" id="suggTitle">Proposte di stagione</div><div class="chips" id="suggList"></div>
      <button class="ghost" id="surprise">Sorprendimi ↻</button></div>
    <div class="actions"><button class="btn" data-close>Annulla</button><button class="btn primary" id="saveMeal">Salva</button></div>
    ${meal ? `<button class="ghost" id="clearMeal">Svuota questo pasto</button>` : ""}
  `, sheet => {
    let active = split ? "az" : "all"; let shuffle = 0; const typed = new Set();
    const fieldVal = k => ({ t: sheet.querySelector("#in-" + k).value.trim(), x: sheet.querySelector("#x-" + k).checked });
    const renderSugg = () => {
      const q = typed.has(active) ? mainOf(sheet.querySelector("#in-" + active).value) : "";
      let res = suggest(m, date, q.length >= 2 ? q : "", 40);
      if (!q && shuffle) { res = res.slice(); for (let k = res.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [res[k], res[j]] = [res[j], res[k]]; } }
      res = res.slice(0, 8);
      sheet.querySelector("#suggTitle").textContent = q.length >= 2 ? "Dall'archivio" : `Proposte di ${seasonOfMonth(date.getMonth()).nome.toLowerCase()}`;
      sheet.querySelector("#suggList").innerHTML = res.length ? res.map(({ r, usedRecently }) => {
        const side = [...r.sides].sort((a, b) => b[1] - a[1])[0]?.[0];
        const full = side ? `${r.name} + ${side.toLowerCase()}` : r.name;
        return `<button class="chip ${usedRecently ? "seen" : ""}" data-pick="${esc(full)}" title="${usedRecently ? "Fatta di recente" : ""}">${r.fav ? "♥ " : ""}${esc(full)}</button>`;
      }).join("") : `<span class="count-note">Nessuna proposta: scrivi tu e la ricetta entra nell'archivio.</span>`;
    };
    sheet.querySelector("#splitT").addEventListener("change", e => {
      const on = e.target.checked;
      sheet.querySelector("#fieldsAll").hidden = on; sheet.querySelector("#fieldsSplit").hidden = !on;
      if (on) { const a = fieldVal("all"); if (a.t && !sheet.querySelector("#in-az").value) { sheet.querySelector("#in-az").value = a.t; sheet.querySelector("#in-at").value = a.t; } active = "az"; }
      else { if (!sheet.querySelector("#in-all").value) sheet.querySelector("#in-all").value = sheet.querySelector("#in-az").value; active = "all"; }
      renderSugg();
    });
    sheet.querySelectorAll("input[type=text]").forEach(inp => {
      inp.addEventListener("focus", () => { active = inp.id.slice(3); renderSugg(); });
      inp.addEventListener("input", () => { typed.add(inp.id.slice(3)); renderSugg(); });
    });
    sheet.querySelector("#suggList").addEventListener("click", e => {
      const b = e.target.closest("[data-pick]"); if (!b) return;
      const inp = sheet.querySelector("#in-" + active); inp.value = b.dataset.pick; sheet.querySelector("#x-" + active).checked = false; typed.delete(active);
      if (active === "az" && !sheet.querySelector("#in-at").value) active = "at";
      renderSugg();
    });
    sheet.querySelector("#surprise").addEventListener("click", () => { shuffle++; typed.delete(active); renderSugg(); });
    const save = async (value) => {
      if (!guardWrite()) return;
      day[m] = value;
      try { await Store.saveWeek(w); closeSheet(); toast("Salvato"); } catch {}
    };
    sheet.querySelector("#saveMeal").addEventListener("click", () => {
      const pack = v => v.t ? (v.x ? { t: v.t, x: 1 } : { t: v.t }) : null;
      if (sheet.querySelector("#splitT").checked) {
        const az = pack(fieldVal("az")), at = pack(fieldVal("at"));
        save(az || at ? { split: 1, az, at } : null);
      } else save(pack(fieldVal("all")));
    });
    sheet.querySelector("#clearMeal")?.addEventListener("click", () => save(null));
    sheet.querySelectorAll("input[type=text]").forEach(inp => inp.addEventListener("keydown", e => { if (e.key === "Enter") sheet.querySelector("#saveMeal").click(); }));
    renderSugg();
  });
}

/* --- nuova settimana --- */
async function startWeek(kind) {
  if (!guardWrite()) return;
  const id = isoDate(ui.weekStart);
  const w = { id, days: emptyDays() };
  const prev = weekDoc(isoDate(addDays(ui.weekStart, -7)));
  if (kind === "copyBreakfast" && prev) prev.days.forEach((d, i) => { if (d.c) w.days[i].c = clone(d.c); });
  if (kind === "propose") {
    buildIndex();
    if (prev) prev.days.forEach((d, i) => { if (d.c && i < 5) w.days[i].c = clone(d.c); });
    const used = new Set();
    for (let i = 0; i < 5; i++) {
      const date = addDays(ui.weekStart, i);
      for (const m of ["p", "d"]) {
        const pool = suggest(m, date, "", 12, used).filter(x => !x.usedRecently);
        if (!pool.length) continue;
        const pick = pool[Math.floor(Math.random() * Math.min(pool.length, 6))].r;
        used.add(pick.key);
        const side = [...pick.sides].sort((a, b) => b[1] - a[1])[0]?.[0];
        w.days[i][m] = { t: side ? `${pick.name} + ${side.toLowerCase()}` : pick.name };
      }
    }
  }
  try { await Store.saveWeek(w); toast(kind === "propose" ? "Proposta pronta: tocca un pasto per cambiarlo" : "Settimana creata"); } catch {}
}

/* ================= render & routing ================= */
function render() {
  recipeIndex = null;

  $("#v-settimana").hidden = ui.tab !== "settimana";
  $("#v-ricette").hidden = ui.tab !== "ricette";
  $("#v-storico").hidden = ui.tab !== "storico";

  if (ui.tab === "settimana") renderWeek();
  if (ui.tab === "ricette") {

  if (prev !== ui.tab) window.scrollTo(0, 0);

/* swipe orizzontale sulla settimana */
let sx = null, sy = null;
$("#v-settimana").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$("#v-settimana").addEventListener("touchend", e => {
  if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) goWeek(addDays(ui.weekStart, dx < 0 ? 7 : -7));
}, { passive: true });
window.addEventListener("hashchange", route);

route();
Store.init(render);
})();
</script>
</body></html>
