<!-- Sorgente dell icona dell app: aprila nel browser e fai uno screenshot 1024x1024 per rigenerare docs/icon-*.png -->
<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}svg{display:block}</style></head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="g" width="256" height="256" patternUnits="userSpaceOnUse">
      <rect width="256" height="256" fill="#fbf7f2"/>
      <rect x="0" y="0" width="128" height="256" fill="#d0303c" opacity=".55"/>
      <rect x="0" y="0" width="256" height="128" fill="#d0303c" opacity=".55"/>
    </pattern>
    <radialGradient id="pl" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef0f2"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#8d969f"/><stop offset=".45" stop-color="#d9dee3"/><stop offset="1" stop-color="#9aa3ac"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5a1a1f" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#g)"/>
  <!-- piatto -->
  <g filter="url(#sh)"><circle cx="512" cy="512" r="292" fill="url(#pl)"/></g>
  <circle cx="512" cy="512" r="292" fill="none" stroke="#d9dde1" stroke-width="6"/>
  <circle cx="512" cy="512" r="200" fill="#ffffff" stroke="#dfe3e7" stroke-width="10"/>
  <!-- forchetta -->
  <g filter="url(#sh)" fill="url(#metal)">
    <rect x="104" y="170" width="21" height="170" rx="10"/>
    <rect x="135" y="170" width="17" height="170" rx="8"/>
    <rect x="166" y="170" width="17" height="170" rx="8"/>
    <rect x="197" y="170" width="17" height="170" rx="8"/>
    <path d="M100 320 h122 v24 q0 66 -42 86 h-38 q-42 -20 -42 -86 z"/>
    <rect x="146" y="410" width="36" height="80" rx="12"/>
    <rect x="130" y="470" width="68" height="390" rx="34"/>
  </g>
  <!-- coltello -->
  <g filter="url(#sh)" fill="url(#metal)">
    <path d="M840 160 q84 44 84 230 v100 h-84 z"/>
    <rect x="832" y="470" width="68" height="390" rx="34"/>
  </g>
</svg></body></html>
